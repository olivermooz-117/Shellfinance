services:
  postgres:
    image: postgres:17-alpine
    container_name: shellfinance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shellfinance
      POSTGRES_USER: shellfinance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shellfinance_dev_only}
    ports:
      - "5434:5432"
    volumes:
      - shellfinance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shellfinance -d shellfinance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shellfinance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - shellfinance_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shellfinance_postgres:
  shellfinance_redis:
